<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .task-enter {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .task-exit {
            animation: slideOut 0.3s ease-out forwards;
        }
        @keyframes slideOut {
            to {
                opacity: 0;
                transform: translateX(20px);
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen">
    <div class="container mx-auto max-w-2xl px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-slate-800 mb-2">📝 Мой Todo List</h1>
            <p class="text-slate-600">Организуйте свои задачи</p>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="bg-white rounded-lg shadow-sm p-4 text-center">
                <div class="text-2xl font-bold text-blue-600" id="totalCount">0</div>
                <div class="text-xs text-slate-500">Всего</div>
            </div>
            <div class="bg-white rounded-lg shadow-sm p-4 text-center">
                <div class="text-2xl font-bold text-green-600" id="completedCount">0</div>
                <div class="text-xs text-slate-500">Выполнено</div>
            </div>
            <div class="bg-white rounded-lg shadow-sm p-4 text-center">
                <div class="text-2xl font-bold text-orange-600" id="activeCount">0</div>
                <div class="text-xs text-slate-500">Активных</div>
            </div>
        </div>

        <!-- Add task form -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
            <form id="taskForm" class="flex gap-2">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Введите новую задачу..."
                    class="flex-1 px-4 py-3 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                    required
                    maxlength="200"
                >
                <button
                    type="submit"
                    class="px-6 py-3 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 active:scale-95 transition-all shadow-sm hover:shadow"
                >
                    Добавить
                </button>
            </form>
        </div>

        <!-- Filters -->
        <div class="flex gap-2 mb-4 justify-center">
            <button data-filter="all" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white transition">
                Все
            </button>
            <button data-filter="active" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-white text-slate-600 hover:bg-slate-50 transition">
                Активные
            </button>
            <button data-filter="completed" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-white text-slate-600 hover:bg-slate-50 transition">
                Выполненные
            </button>
        </div>

        <!-- Tasks list -->
        <div id="taskList" class="space-y-2">
            <!-- Tasks will be rendered here -->
        </div>

        <!-- Empty state -->
        <div id="emptyState" class="text-center py-12 text-slate-400">
            <div class="text-6xl mb-3">✨</div>
            <p class="text-lg">Список задач пуст</p>
            <p class="text-sm">Добавьте первую задачу выше</p>
        </div>

        <!-- Clear completed -->
        <div id="clearSection" class="mt-6 text-center hidden">
            <button
                id="clearCompleted"
                class="text-sm text-red-600 hover:text-red-700 hover:underline transition"
            >
                Очистить выполненные
            </button>
        </div>
    </div>

    <script>
        // State
        let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
        let currentFilter = 'all';
        let nextId = tasks.length > 0 ? Math.max(...tasks.map(t => t.id)) + 1 : 1;

        // DOM elements
        const taskForm = document.getElementById('taskForm');
        const taskInput = document.getElementById('taskInput');
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');
        const clearSection = document.getElementById('clearSection');
        const totalCount = document.getElementById('totalCount');
        const completedCount = document.getElementById('completedCount');
        const activeCount = document.getElementById('activeCount');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const clearCompletedBtn = document.getElementById('clearCompleted');

        // Save to localStorage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // Add task
        function addTask(text) {
            const task = {
                id: nextId++,
                text: text.trim(),
                completed: false,
                createdAt: new Date().toISOString()
            };
            tasks.unshift(task);
            saveTasks();
            render();
        }

        // Toggle task
        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                render();
            }
        }

        // Delete task
        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            render();
        }

        // Clear completed
        function clearCompleted() {
            tasks = tasks.filter(t => !t.completed);
            saveTasks();
            render();
        }

        // Update stats
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const active = total - completed;

            totalCount.textContent = total;
            completedCount.textContent = completed;
            activeCount.textContent = active;

            // Show/hide clear section
            if (completed > 0) {
                clearSection.classList.remove('hidden');
            } else {
                clearSection.classList.add('hidden');
            }
        }

        // Filter tasks
        function getFilteredTasks() {
            switch (currentFilter) {
                case 'active':
                    return tasks.filter(t => !t.completed);
                case 'completed':
                    return tasks.filter(t => t.completed);
                default:
                    return tasks;
            }
        }

        // Render
        function render() {
            const filteredTasks = getFilteredTasks();

            // Update filter buttons
            filterBtns.forEach(btn => {
                if (btn.dataset.filter === currentFilter) {
                    btn.className = 'filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white transition';
                } else {
                    btn.className = 'filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-white text-slate-600 hover:bg-slate-50 transition';
                }
            });

            // Empty state
            if (filteredTasks.length === 0) {
                taskList.innerHTML = '';
                emptyState.classList.remove('hidden');
                if (currentFilter === 'completed') {
                    emptyState.querySelector('p:first-of-type').textContent = 'Нет выполненных задач';
                } else if (currentFilter === 'active') {
                    emptyState.querySelector('p:first-of-type').textContent = 'Нет активных задач';
                } else {
                    emptyState.querySelector('p:first-of-type').textContent = 'Список задач пуст';
                }
            } else {
                emptyState.classList.add('hidden');
                taskList.innerHTML = filteredTasks.map(task => `
                    <div class="task-enter bg-white rounded-lg shadow-sm p-4 flex items-center gap-3 hover:shadow-md transition group">
                        <input
                            type="checkbox"
                            ${task.completed ? 'checked' : ''}
                            onchange="toggleTask(${task.id})"
                            class="w-5 h-5 text-blue-600 rounded cursor-pointer flex-shrink-0"
                        >
                        <span class="flex-1 ${task.completed ? 'line-through text-slate-400' : 'text-slate-800'} break-words transition-all">
                            ${escapeHtml(task.text)}
                        </span>
                        <button
                            onclick="deleteTask(${task.id})"
                            class="opacity-0 group-hover:opacity-100 text-red-500 hover:text-red-700 hover:bg-red-50 w-8 h-8 rounded-lg flex items-center justify-center transition flex-shrink-0"
                            title="Удалить"
                        >
                            ✕
                        </button>
                    </div>
                `).join('');
            }

            updateStats();
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            if (text) {
                addTask(text);
                taskInput.value = '';
                taskInput.focus();
            }
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        clearCompletedBtn.addEventListener('click', clearCompleted);

        // Initial render
        render();
    </script>
</body>
</html>
